spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3309}/bd_paytur_test
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop ## ddl-auto: create-drop: cria o esquema para os testes e o descarta ao final.
    open-in-view: false ## Porta aleatória para o servidor.

server:
  port: 0
