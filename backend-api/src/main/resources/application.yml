spring:
  application:
    name: julyturadm-backend

  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3309}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8081

julyturadm:
  security:
    jwt:
      secret: ${JWT_SECRET}